name: Publish extension

# Publishes ruxx-xml to the VS Code Marketplace and Open VSX, one VSIX per
# platform with the matching ruxx binary bundled. Tagging a release triggers it;
# without VSCE_PAT/OVSX_PAT secrets it only packages, so the workflow is safe in
# a fork.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: marketplace + open vsx
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - run: npm ci

      - name: Check publishing tokens
        id: tokens
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ] && [ -z "$OVSX_PAT" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No publishing tokens configured; packaging only."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - run: npm run compile

      - name: Package one VSIX per platform
        run: npm run package:targets

      - name: Publish
        if: steps.tokens.outputs.available == 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: bash scripts/publish.sh

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: editors/vscode/*.vsix
          if-no-files-found: error
